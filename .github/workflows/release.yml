name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그 (v1.2.3). 태그 푸시가 아니면 이 값으로 versionName과 GitHub Release를 만듭니다."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: bungae-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3 -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          rm -rf /tmp/cmdline-extract
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdline-extract
          mkdir -p "$SDK/cmdline-tools/latest"
          if [ -d /tmp/cmdline-extract/cmdline-tools ]; then
            cp -a /tmp/cmdline-extract/cmdline-tools/. "$SDK/cmdline-tools/latest/"
          else
            cp -a /tmp/cmdline-extract/. "$SDK/cmdline-tools/latest/"
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/tmp/sdk-licenses.log || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-37.2" \
            "build-tools;36.0.0" \
            "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Resolve version and signing
        id: meta
        env:
          BUNGAE_KEYSTORE_BASE64: ${{ secrets.BUNGAE_KEYSTORE_BASE64 }}
          BUNGAE_KEYSTORE_PASSWORD: ${{ secrets.BUNGAE_KEYSTORE_PASSWORD }}
          BUNGAE_KEY_ALIAS: ${{ secrets.BUNGAE_KEY_ALIAS }}
          BUNGAE_KEY_PASSWORD: ${{ secrets.BUNGAE_KEY_PASSWORD }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          else
            echo "Push a v* tag, or run this workflow with the tag input set to v1.2.3." >&2
            exit 1
          fi
          if [[ ! "${tag}" =~ ^v[0-9] ]]; then
            echo "Tag must look like v1.2.3 (got ${tag})." >&2
            exit 1
          fi
          version_name="${tag#v}"
          version_code="${GITHUB_RUN_NUMBER}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "BUNGAE_VERSION_CODE=${version_code}" >> "$GITHUB_ENV"
          echo "BUNGAE_VERSION_NAME=${version_name}" >> "$GITHUB_ENV"
          echo "BUNGAE_GIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

          phone_sha="7B49D0522171AADC5DFCBA49955763F396948923B30FAB459C5966D6482E796D"
          if [[ -n "${BUNGAE_KEYSTORE_BASE64}" && -n "${BUNGAE_KEYSTORE_PASSWORD}" && -n "${BUNGAE_KEY_ALIAS}" && -n "${BUNGAE_KEY_PASSWORD}" ]]; then
            ks="${RUNNER_TEMP}/bungae-release.keystore"
            printf '%s' "${BUNGAE_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 -d > "${ks}"
            test -s "${ks}"
            keytool -list -keystore "${ks}" -storepass "${BUNGAE_KEYSTORE_PASSWORD}" -alias "${BUNGAE_KEY_ALIAS}" >/dev/null
            actual="$(keytool -list -v -keystore "${ks}" -storepass "${BUNGAE_KEYSTORE_PASSWORD}" -alias "${BUNGAE_KEY_ALIAS}" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
            compact="$(printf '%s' "${actual}" | tr -d ' :' | tr '[:lower:]' '[:upper:]')"
            echo "Release keystore SHA-256: ${actual}"
            if [[ "${compact}" == "${phone_sha}" ]]; then
              echo "Release keystore matches the installed phone certificate."
            else
              echo "Release keystore SHA-256 does not match the installed phone certificate ${phone_sha}."
              echo "An update over that install will be rejected until the secret keystore is that certificate."
            fi
            echo "BUNGAE_STORE_FILE=${ks}" >> "$GITHUB_ENV"
            echo "signing=release-secret" >> "$GITHUB_OUTPUT"
          else
            test -f debug.keystore
            actual="$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
            compact="$(printf '%s' "${actual}" | tr -d ' :' | tr '[:lower:]' '[:upper:]')"
            echo "Release signing secrets are absent."
            echo "Signing with the committed debug.keystore so an install of that key can still be updated."
            echo "debug.keystore SHA-256: ${actual}"
            if [[ "${compact}" == "${phone_sha}" ]]; then
              echo "Committed debug.keystore matches the installed phone certificate."
            else
              echo "Committed debug.keystore does NOT match the installed phone certificate ${phone_sha}."
              echo "This APK cannot replace that install. Add BUNGAE_KEYSTORE_BASE64, BUNGAE_KEYSTORE_PASSWORD, BUNGAE_KEY_ALIAS, and BUNGAE_KEY_PASSWORD for the matching key."
            fi
            echo "signing=debug-keystore-fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        env:
          BUNGAE_KEYSTORE_PASSWORD: ${{ secrets.BUNGAE_KEYSTORE_PASSWORD }}
          BUNGAE_KEY_ALIAS: ${{ secrets.BUNGAE_KEY_ALIAS }}
          BUNGAE_KEY_PASSWORD: ${{ secrets.BUNGAE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK and checksums
        id: apk
        run: |
          set -euo pipefail
          src="$(echo app/build/outputs/apk/release/*.apk)"
          test -f "$src"
          tag="${{ steps.meta.outputs.tag }}"
          code="${{ steps.meta.outputs.version_code }}"
          mkdir -p dist
          asset="dist/bungae-alert-${tag}-vc${code}.apk"
          cp "$src" "$asset"
          (cd dist && sha256sum "$(basename "$asset")" > SHA256SUMS)
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          echo "sums=dist/SHA256SUMS" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bungae-release-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          code="${{ steps.meta.outputs.version_code }}"
          name="${{ steps.meta.outputs.version_name }}"
          signing="${{ steps.meta.outputs.signing }}"
          asset="${{ steps.apk.outputs.asset }}"
          sums="${{ steps.apk.outputs.sums }}"
          repo="${GITHUB_REPOSITORY}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          cat > "$notes_file" <<EOF
          번개알림 ${tag}

          versionCode: ${code}
          versionName: ${name}
          commit: ${GITHUB_SHA}
          signing: ${signing}

          앱에서 업데이트를 누르면 이 파일을 받아 확인한 뒤 설치를 시작합니다. 누르기 전에는 설치하지 않습니다. 휴대폰 설치 확인 창은 한 번 나옵니다.
          EOF
          sed -i 's/^[[:space:]]*//' "$notes_file"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            while IFS= read -r old_name; do
              case "$old_name" in
                bungae-alert-*.apk|SHA256SUMS)
                  gh release delete-asset "$tag" "$old_name" --repo "$repo" --yes || true
                  ;;
              esac
            done < <(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name' || true)
            gh release upload "$tag" "$asset" "$sums" --repo "$repo" --clobber
            gh release edit "$tag" --repo "$repo" --notes-file "$notes_file"
          else
            gh release create "$tag" "$asset" "$sums" \
              --repo "$repo" \
              --title "$tag" \
              --notes-file "$notes_file" \
              --target "$GITHUB_SHA"
          fi
